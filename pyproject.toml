[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-detector"
version = "2.0.0"
description = "Phát hiện giọng nói giả (deepfake audio) tiếng Việt — WavLM + classifier"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "soundfile>=0.12",
    "librosa>=0.10",
    "PyYAML>=6.0",
    "tqdm>=4.66",
    "torch>=2.1",
    "transformers>=4.40",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
hf = ["datasets>=2.18"]
generate = ["piper-tts>=1.3.0"]
dev = ["pytest>=8.0"]

[project.scripts]
aidetector = "aidetector.cli:main"

[tool.setuptools.packages.find]
include = ["aidetector*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
]
