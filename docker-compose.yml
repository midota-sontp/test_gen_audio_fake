# Tất cả service dùng chung một image và cùng bộ mount, chỉ khác lệnh chạy.
# Dữ liệu host cần ingest: đặt vào ./raw (hoặc sửa mount `- ./raw:/data:ro`).

x-common: &common
  image: ai-detector:latest
  build:
    context: .
    dockerfile: docker/Dockerfile
    args:
      # Đặt 1 để cài luôn piper / kokoro / omnivoice vào image.
      WITH_GENERATORS: ${WITH_GENERATORS:-0}
  volumes:
    - ./raw:/data:ro              # dataset thô (chỉ đọc)
    - ./corpus:/workspace/corpus  # dữ liệu đã chuẩn hoá + manifest.csv
    - ./features:/workspace/features
    - ./checkpoints:/workspace/checkpoints
    - ./reports:/workspace/reports
    - ./models:/workspace/models  # giọng Piper, checkpoint tải về
    - ./configs:/workspace/configs
    - hf_cache:/hf_cache          # cache WavLM & HuggingFace
  environment:
    - HF_TOKEN=${HF_TOKEN:-}

services:
  # Nạp dataset thật: docker compose run --rm ingest /data/vivos
  ingest:
    <<: *common
    command: ["ingest"]

  # Sinh fake: docker compose run --rm generate --engines piper --count 1000
  generate:
    <<: *common
    command: ["generate"]

  # Huấn luyện trọn gói từ corpus đã có: split → features → train → evaluate
  pipeline:
    <<: *common
    command: ["run", "split", "features", "train", "evaluate"]

  # Lệnh tuỳ ý: docker compose run --rm cli detect /data/thu.wav
  cli:
    <<: *common
    command: ["info"]

volumes:
  hf_cache:
