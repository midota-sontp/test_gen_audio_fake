services:
  # Full training pipeline on the LOCAL dataset:
  #   download(local ingest) -> preprocess -> extract(WavLM) -> train -> evaluate
  # CPU-only. WavLM weights download once into the hf_cache volume (needs internet on
  # the first run); mount ./models/wavlm-base instead to run fully offline.
  train:
    build:
      context: .
      dockerfile: docker/Dockerfile.train
    image: ai-detector:train
    volumes:
      # Input dataset (read-only).
      - ./dataset:/workspace/dataset:ro
      # Optional offline WavLM weights (used automatically if present).
      - ./models:/workspace/models:ro
      # Persisted artifacts + HF weights cache (survive container restarts).
      - ./data:/workspace/data
      - ./checkpoints:/workspace/checkpoints
      - ./reports:/workspace/reports
      - ./experiments:/workspace/experiments
      - ./configs:/workspace/configs
      - hf_cache:/hf_cache
    command: ["python", "run_pipeline.py", "--config", "configs/mvp.yaml"]

volumes:
  hf_cache:
