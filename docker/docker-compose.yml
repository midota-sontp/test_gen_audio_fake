name: ai-detector

# Mọi service dùng chung đúng một image và một volume.
x-base: &base
  image: ai-detector/corpus-builder:latest
  volumes:
    - corpus-data:/data
  environment: &env
    KAGGLE_API_TOKEN: ${KAGGLE_API_TOKEN:-}
    KAGGLE_USERNAME: ${KAGGLE_USERNAME:-}
    KAGGLE_KEY: ${KAGGLE_KEY:-}
    KAGGLE_DATASET_SLUG: ${KAGGLE_DATASET_SLUG:-vietnamese-audio-deepfake-demo}
    HF_TOKEN: ${HF_TOKEN:-}

services:
  # Phần REAL: chạy nhiều giờ nên để nền.
  #   docker compose up -d corpus
  corpus:
    <<: *base
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: corpus-builder
    # Tự dậy lại khi CHẾT (OOM, đứt mạng); con trỏ resume lo phần còn lại.
    # Không dùng unless-stopped: nó restart cả khi job đã xong và exit 0.
    restart: on-failure
    stop_grace_period: 120s      # đủ để chốt checkpoint cuối khi nhận SIGTERM
    command: ["real"]

  # UI theo dõi tiến độ: http://<máy>:8000
  #   docker compose up -d dashboard
  dashboard:
    <<: *base
    restart: unless-stopped
    ports:
      - "${DASHBOARD_PORT:-8000}:8000"
    command: ["dashboard"]

  # Mọi việc còn lại, chạy một lần rồi thoát:
  #   docker compose run --rm cli fake
  #   docker compose run --rm cli export --verify
  #   docker compose run --rm cli split --dry-run
  #   docker compose run --rm cli audit
  #   docker compose run --rm cli push --delete-old-versions
  #   docker compose run --rm cli monitor --watch 10
  cli:
    <<: *base
    command: []

volumes:
  corpus-data:
